# ==============================================================================
# Home Assistant Example Automations for SmartDisplay
# ==============================================================================
# Replace 'smartdisplay' with your entity prefix if customized.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Doorbell Pressed: Display Notification + Audio TTS Announcement
# ------------------------------------------------------------------------------
- id: smartdisplay_doorbell_alert
  alias: "SmartDisplay - Doorbell Pressed"
  description: "Displays a doorbell notification card and plays a voice chime on the speaker"
  trigger:
    - platform: state
      entity_id: binary_sensor.doorbell
      to: "on"
  action:
    # Wake screen & display visual notification card
    - action: esphome.smartdisplay_send_notification
      data:
        message: "Someone is at the front door!"
        icon: "home"
        text_color: "cyan"
        timeout: 45
    # Play spoken TTS announcement over the speaker
    - action: tts.speak
      target:
        entity_id: tts.google_en_com # or tts.piper / your local TTS engine
      data:
        media_player_entity_id: media_player.smartdisplay_speaker
        message: "Someone is at the front door."

# ------------------------------------------------------------------------------
# 2. Washing Machine / Dryer Cycle Finished
# ------------------------------------------------------------------------------
- id: smartdisplay_laundry_done
  alias: "SmartDisplay - Laundry Finished"
  description: "Alerts when the washing machine cycle is complete"
  trigger:
    - platform: state
      entity_id: sensor.washing_machine_status
      to: "completed"
  action:
    - action: esphome.smartdisplay_send_notification
      data:
        message: "Washing machine cycle finished! Empty the drum."
        icon: "sentiment_satisfied"
        text_color: "green"
        timeout: 60

# ------------------------------------------------------------------------------
# 3. High Temperature / Thermostat Warning
# ------------------------------------------------------------------------------
- id: smartdisplay_high_temp_alert
  alias: "SmartDisplay - High Temperature Alert"
  description: "Warns if indoor temperature exceeds 28°C"
  trigger:
    - platform: numeric_state
      entity_id: sensor.living_room_temperature
      above: 28.0
  action:
    - action: esphome.smartdisplay_send_notification
      data:
        message: "Living Room is very hot (above 28°C)!"
        icon: "thermometer"
        text_color: "red"
        timeout: 120

# ------------------------------------------------------------------------------
# 4. Window Left Open Warning (e.g. When Rain Forecasted)
# ------------------------------------------------------------------------------
- id: smartdisplay_window_open_rain
  alias: "SmartDisplay - Rain Warning Window Open"
  description: "Alerts if windows are open when rain begins"
  trigger:
    - platform: state
      entity_id: weather.forecast_casa
      to: "rainy"
  condition:
    - condition: state
      entity_id: binary_sensor.bedroom_window
      state: "on"
  action:
    - action: esphome.smartdisplay_send_notification
      data:
        message: "It started raining and the bedroom window is OPEN!"
        icon: "window"
        text_color: "orange"
        timeout: 90

# ------------------------------------------------------------------------------
# 5. Houseplant Needs Water (Xiaomi Mi Flora via BLE Proxy)
# ------------------------------------------------------------------------------
- id: smartdisplay_plant_watering_alert
  alias: "SmartDisplay - Plant Watering Alert"
  description: "Alerts when a houseplant's soil moisture drops below threshold"
  trigger:
    - platform: numeric_state
      entity_id: sensor.monstera_soil_moisture
      below: 20
  action:
    - action: esphome.smartdisplay_send_notification
      data:
        message: "Your Monstera needs water! Moisture is low (18%)."
        icon: "home"
        text_color: "green"
        timeout: 120
