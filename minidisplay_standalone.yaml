# ==============================================================================
# SP-ESP32-S3-1.28-BOX Smart Display
# Standalone All-In-One ESPHome Configuration
# ==============================================================================
# Target Hardware: ESP32-S3 1.28" Round Display with Touch, Audio & Battery
# Display: GC9A01A (240x240 circular SPI)
# Touch: CST816D (Capacitive I2C)
# Audio DAC: ES8311 (I2S + I2C control)
# ==============================================================================

substitutions:
  device_name: "minidisplay"
  friendly_name: "MiniDisplay"
  timezone: "Europe/Rome"
  weather_entity: "weather.forecast_casa"
  sleep_timeout: "300s"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2024.10.0
  name_add_mac_suffix: false
  on_boot:
    priority: -100
    then:
      - lvgl.page.show: home_page
      - light.turn_on:
          id: display_backlight
          transition_length: 250ms
      - script.execute: reset_sleep_timer

esp32:
  variant: esp32s3
  framework:
    type: esp-idf
    advanced:
      flash_chip: generic

# 8MB Octal SPI PSRAM at 80MHz
psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Optimization A: Event-driven clock updates
time:
  - platform: sntp
    id: sntp_time
    timezone: ${timezone}
    on_time_sync:
      then:
        - script.execute: update_clock_ui
    on_time:
      - seconds: 0
        then:
          - script.execute: update_clock_ui

# Passive Bluetooth proxy mode to prevent audio stuttering during TTS
esp32_ble_tracker:
  scan_parameters:
    active: false

bluetooth_proxy:
  active: false

# ==============================================================================
# NOTIFICATION SYSTEM (LIFO QUEUE)
# ==============================================================================
globals:
  - id: notif_texts
    type: std::vector<std::string>
    restore_value: no

  - id: notif_icons
    type: std::vector<std::string>
    restore_value: no

  - id: notif_colors
    type: std::vector<uint32_t>
    restore_value: no

  - id: current_notif_idx
    type: int
    restore_value: no
    initial_value: '0'

api:
  reboot_timeout: 0s
  actions:
    - action: send_notification
      variables:
        message: string
        icon: string
        text_color: string
        timeout: int
      then:
        - lambda: |-
            std::string color_str(text_color.c_str());
            uint32_t rgb = 0xFFFFFF; // Default: White

            // Parse color: accepts #RRGGBB, 0xRRGGBB, plain hex RRGGBB, or CSS color names
            if (!color_str.empty()) {
              if (color_str[0] == '#') {
                rgb = strtoul(color_str.c_str() + 1, nullptr, 16) & 0xFFFFFF;
              } else if (color_str.size() >= 2 && color_str[0] == '0' && (color_str[1] == 'x' || color_str[1] == 'X')) {
                rgb = strtoul(color_str.c_str() + 2, nullptr, 16) & 0xFFFFFF;
              } else if (color_str == "red")     rgb = 0xFF0000;
              else if (color_str == "green")   rgb = 0x00FF00;
              else if (color_str == "blue")    rgb = 0x3399FF;
              else if (color_str == "yellow")  rgb = 0xFFFF00;
              else if (color_str == "orange")  rgb = 0xFF8800;
              else if (color_str == "cyan")    rgb = 0x00FFFF;
              else if (color_str == "magenta") rgb = 0xFF00FF;
              else if (color_str == "black")   rgb = 0x000000;
              else if (color_str == "white")   rgb = 0xFFFFFF;
              else {
                char *end = nullptr;
                uint32_t parsed = strtoul(color_str.c_str(), &end, 16);
                if (end != color_str.c_str()) {
                  rgb = parsed & 0xFFFFFF;
                }
              }
            }

            // LIFO Queue: insert new notification at index 0
            id(notif_texts).insert(id(notif_texts).begin(), std::string(message.c_str()));
            id(notif_icons).insert(id(notif_icons).begin(), std::string(icon.c_str()));
            id(notif_colors).insert(id(notif_colors).begin(), rgb);

            // Keep maximum 10 notifications
            while (id(notif_texts).size() > 10) {
              id(notif_texts).pop_back();
              id(notif_icons).pop_back();
              id(notif_colors).pop_back();
            }

            id(current_notif_idx) = 0;
            if (timeout < 0) timeout = 0;

            ESP_LOGI(
              "notify",
              "Notification received: icon=%s timeout=%ds message=%s",
              icon.c_str(), (int) timeout, message.c_str()
            );

        - script.stop: notification_timeout
        - script.execute: show_notification_transition
        - script.execute: update_badge_ui
        - light.turn_on:
            id: display_backlight
            transition_length: 250ms
        - script.execute: reset_sleep_timer
        - if:
            condition:
              lambda: 'return timeout > 0;'
            then:
              - script.execute:
                  id: notification_timeout
                  timeout_sec: !lambda 'return timeout;'

# ==============================================================================
# SCRIPTS (DISPLAY, POWER & UI)
# ==============================================================================
script:
  # Inactivity sleep timer: only active when running on battery
  - id: reset_sleep_timer
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return !id(charging_sensor).state;'
          then:
            - delay: ${sleep_timeout}
            - if:
                condition:
                  lambda: 'return !id(charging_sensor).state;'
                then:
                  - light.turn_off:
                      id: display_backlight
                      transition_length: 500ms

  # Double-tap toggle handler
  - id: toggle_display
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(charging_sensor).state;'
          then:
            - light.turn_on:
                id: display_backlight
                transition_length: 250ms
          else:
            - if:
                condition:
                  lambda: 'return id(display_backlight).current_values.is_on();'
                then:
                  - script.stop: reset_sleep_timer
                  - light.turn_off:
                      id: display_backlight
                      transition_length: 250ms
                else:
                  - lvgl.page.show:
                      id: home_page
                  - light.turn_on:
                      id: display_backlight
                      transition_length: 250ms
                  - script.execute: reset_sleep_timer

  # Updates the notification UI widgets
  - id: update_notification_ui
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(notif_texts).empty();'
          then:
            - lvgl.label.update:
                id: notif_icon_label
                text: ""
            - lvgl.label.update:
                id: notif_text_label
                text: "No notifications"
                text_color: 0xFFFFFF
            - lvgl.label.update:
                id: notif_counter_label
                text: "0/0"
          else:
            - lvgl.label.update:
                id: notif_icon_label
                text: !lambda |-
                  const auto &icon = id(notif_icons)[id(current_notif_idx)];
                  if (icon == "warning")             return std::string("\uE002");
                  if (icon == "info")                return std::string("\uE88E");
                  if (icon == "sentiment_satisfied") return std::string("\uE813");
                  if (icon == "home")                return std::string("\uE88A");
                  if (icon == "window")              return std::string("\uF088");
                  if (icon == "thermometer")         return std::string("\uE846");
                  if (icon == "lightbulb")           return std::string("\uE90F");
                  if (icon == "lock")                return std::string("\uE897");
                  if (icon == "lock_open")           return std::string("\uE898");
                  if (icon == "notifications")       return std::string("\uE7F4");
                  if (icon == "delete")              return std::string("\uE872");
                  return std::string("\uE7F4");
                text_color: !lambda |-
                  const uint32_t rgb = id(notif_colors)[id(current_notif_idx)];
                  return Color((rgb >> 16) & 0xFF, (rgb >> 8) & 0xFF, rgb & 0xFF);

            - lvgl.label.update:
                id: notif_text_label
                text: !lambda 'return id(notif_texts)[id(current_notif_idx)];'
                text_color: !lambda |-
                  const uint32_t rgb = id(notif_colors)[id(current_notif_idx)];
                  return Color((rgb >> 16) & 0xFF, (rgb >> 8) & 0xFF, rgb & 0xFF);

            - lvgl.label.update:
                id: notif_counter_label
                text: !lambda |-
                  char buf[32];
                  snprintf(
                    buf,
                    sizeof(buf),
                    "%d/%d",
                    id(current_notif_idx) + 1,
                    (int) id(notif_texts).size()
                  );
                  return std::string(buf);

  # Visual white flash transition between notifications
  - id: show_notification_transition
    mode: restart
    then:
      - lvgl.page.show:
          id: transition_page
          animation: NONE
      - delay: 80ms
      - script.execute: update_notification_ui
      - lvgl.page.show:
          id: notifications_page
          animation: NONE

  # Notification auto-dismiss timer
  - id: notification_timeout
    mode: restart
    parameters:
      timeout_sec: int
    then:
      - delay: !lambda 'return timeout_sec * 1000;'
      - lvgl.page.show:
          id: home_page
          animation: FADE_IN
          time: 120ms
      - script.execute: reset_sleep_timer

  # Formats device diagnostics into a clean, centered layout
  - id: update_debug_page
    mode: restart
    then:
      - lvgl.label.update:
          id: debug_info_label
          text: !lambda |-
            std::string ip = id(ip_address).state.empty() ? "Connecting..." : id(ip_address).state;
            std::string ssid = id(wifi_ssid).state.empty() ? "-" : id(wifi_ssid).state;
            const char *charging_str = id(charging_sensor).state ? "Charging" : "Battery";

            char uptime_buf[32];
            uint32_t total = (uint32_t) id(uptime_sensor).state;
            uint32_t days = total / 86400UL;
            total %= 86400UL;
            uint32_t hours = total / 3600UL;
            total %= 3600UL;
            uint32_t mins = total / 60UL;
            snprintf(
              uptime_buf,
              sizeof(uptime_buf),
              "%ud %02uh %02um",
              (unsigned int) days, (unsigned int) hours, (unsigned int) mins
            );

            char buf[512];
            snprintf(
              buf,
              sizeof(buf),
              "IP: %s\n"
              "Wi-Fi: %s (%.0f dBm)\n"
              "Power: %.0f%% (%s)\n"
              "Uptime: %s\n"
              "ESPHome %s",
              ip.c_str(),
              ssid.c_str(),
              id(wifi_signal_db).state,
              id(battery_percentage).state,
              charging_str,
              uptime_buf,
              ESPHOME_VERSION
            );
            return std::string(buf);

  # Updates outdoor weather icon and temperature
  - id: update_weather_ui
    mode: restart
    then:
      - lvgl.label.update:
          id: weather_icon_label
          text: !lambda |-
            std::string cond = id(ha_weather_condition).state;
            if (cond == "sunny")                                 return std::string("\uE81A");
            if (cond == "clear-night")                           return std::string("\uF159");
            if (cond == "partlycloudy")                          return std::string("\uF172");
            if (cond == "cloudy")                                return std::string("\uF15C");
            if (cond == "rainy" || cond == "pouring")            return std::string("\uF176");
            if (cond == "lightning" || cond == "lightning-rainy") return std::string("\uEBDB");
            if (cond == "snowy" || cond == "snowy-rainy" || cond == "hail") return std::string("\uEB3B");
            if (cond == "fog")                                   return std::string("\uE818");
            if (cond == "windy" || cond == "windy-variant")      return std::string("\uF15C");
            return std::string("\uE846");
          text_color: !lambda |-
            std::string cond = id(ha_weather_condition).state;
            if (cond == "sunny")                                 return Color(0xFF, 0xB3, 0x00);
            if (cond == "clear-night")                           return Color(0x80, 0xD8, 0xFF);
            if (cond == "partlycloudy")                          return Color(0xFF, 0xCA, 0x28);
            if (cond == "cloudy")                                return Color(0xB0, 0xBE, 0xC5);
            if (cond == "rainy" || cond == "pouring")            return Color(0x42, 0xA5, 0xF5);
            if (cond == "lightning" || cond == "lightning-rainy") return Color(0xFF, 0xD5, 0x4F);
            if (cond == "snowy" || cond == "snowy-rainy" || cond == "hail") return Color(0xE0, 0xF7, 0xFA);
            if (cond == "fog")                                   return Color(0x90, 0xA4, 0xAE);
            return Color(0xFF, 0xFF, 0xFF);

      - lvgl.label.update:
          id: weather_temp_label
          text: !lambda |-
            if (isnan(id(ha_weather_temp).state)) {
              return std::string("--°C");
            }
            char buf[32];
            snprintf(buf, sizeof(buf), "%.1f°C", id(ha_weather_temp).state);
            return std::string(buf);

  # Optimization A: Updates digital clock on home screen
  - id: update_clock_ui
    mode: restart
    then:
      - lvgl.label.update:
          id: clock_label
          text: !lambda |-
            auto now = id(sntp_time).now();
            if (!now.is_valid()) return std::string("--:--");
            return now.strftime("%H:%M");

  # Optimization C: Updates unread notification badge indicator above clock
  - id: update_badge_ui
    mode: restart
    then:
      - lvgl.label.update:
          id: notif_badge_label
          text: !lambda |-
            if (id(notif_texts).empty()) return std::string("");
            return std::string("\uE7F4"); // Small notification bell icon

# ==============================================================================
# SENSORS & DIAGNOSTICS
# ==============================================================================
sensor:
  - platform: adc
    pin: GPIO1
    id: battery_percentage
    name: "${friendly_name} Battery"
    device_class: battery
    state_class: measurement
    unit_of_measurement: "%"
    accuracy_decimals: 0
    attenuation: 12db
    update_interval: 60s
    filters:
      - multiply: 2.0
      - median:
          window_size: 5
          send_every: 1
      - calibrate_linear:
          - 3.3 -> 0
          - 4.2 -> 100
      - clamp:
          min_value: 0
          max_value: 100

  - platform: wifi_signal
    id: wifi_signal_db
    name: "${friendly_name} Wi-Fi Signal"
    update_interval: 30s
    entity_category: diagnostic

  - platform: uptime
    id: uptime_sensor
    name: "${friendly_name} Uptime"
    update_interval: 60s
    entity_category: diagnostic

  - platform: homeassistant
    id: ha_weather_temp
    entity_id: ${weather_entity}
    attribute: temperature
    internal: true
    on_value:
      then:
        - script.execute: update_weather_ui

binary_sensor:
  - platform: gpio
    pin: GPIO41
    id: charging_sensor
    name: "${friendly_name} Charging Status"
    device_class: battery_charging
    on_press:
      - script.stop: reset_sleep_timer
      - light.turn_on:
          id: display_backlight
          transition_length: 0ms
    on_release:
      - script.execute: reset_sleep_timer

text_sensor:
  - platform: wifi_info
    ip_address:
      id: ip_address
      name: "${friendly_name} IP Address"
      entity_category: diagnostic
    ssid:
      id: wifi_ssid
      name: "${friendly_name} Wi-Fi SSID"
      entity_category: diagnostic
    mac_address:
      id: wifi_mac
      name: "${friendly_name} Wi-Fi MAC Address"
      entity_category: diagnostic

  - platform: version
    name: "${friendly_name} ESPHome Version"
    id: esphome_version_text
    hide_timestamp: true
    entity_category: diagnostic

  - platform: homeassistant
    id: ha_weather_condition
    entity_id: ${weather_entity}
    internal: true
    on_value:
      then:
        - script.execute: update_weather_ui

# ==============================================================================
# BACKLIGHT (PWM)
# ==============================================================================
output:
  - platform: ledc
    pin:
      number: GPIO42
      inverted: true
    frequency: 1000Hz
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    id: display_backlight
    name: "${friendly_name} Backlight"
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms
    on_turn_off:
      then:
        - script.stop: notification_timeout
        - lvgl.page.show:
            id: home_page

# ==============================================================================
# AUDIO ES8311 & I2S MEDIA PLAYER
# ==============================================================================
i2c:
  - id: i2c_touch
    sda: GPIO11
    scl: GPIO7
    scan: false
    frequency: 400kHz

  - id: i2c_audio
    sda: GPIO15
    scl: GPIO14
    scan: true
    frequency: 400kHz

audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: i2c_audio
    address: 0x18
    sample_rate: 24000
    bits_per_sample: 16bit
    use_mclk: true

i2s_audio:
  - id: i2s_out
    i2s_mclk_pin: GPIO16
    i2s_bclk_pin:
      number: GPIO9
    i2s_lrclk_pin:
      number: GPIO45
      ignore_strapping_warning: true

switch:
  - platform: gpio
    id: audio_amp
    name: "${friendly_name} Audio Amplifier"
    internal: true
    pin:
      number: GPIO46
      ignore_strapping_warning: true
    restore_mode: ALWAYS_OFF

speaker:
  - platform: i2s_audio
    id: speaker_hardware
    i2s_audio_id: i2s_out
    i2s_dout_pin: GPIO8
    dac_type: external
    audio_dac: es8311_dac
    sample_rate: 24000
    bits_per_sample: 16bit
    channel: mono
    buffer_duration: 50ms
    timeout: 500ms

media_player:
  - platform: speaker
    id: speaker_media_player
    name: "${friendly_name} Speaker"
    volume_initial: 80%
    volume_min: 0%
    volume_max: 100%
    volume_increment: 5%
    buffer_size: 65536
    task_stack_in_psram: true
    announcement_pipeline:
      speaker: speaker_hardware
      format: WAV
      sample_rate: 24000
      num_channels: 1

    # Optimization D: Dynamic amplifier power management (saves ~20mA in standby)
    on_announcement:
      - switch.turn_on: audio_amp
    on_play:
      - switch.turn_on: audio_amp
    on_idle:
      - delay: 1000ms
      - switch.turn_off: audio_amp

# ==============================================================================
# DISPLAY GC9A01A & TOUCHSCREEN CST816D
# ==============================================================================
spi:
  - id: spi_bus
    clk_pin: GPIO4
    mosi_pin: GPIO2

display:
  - platform: mipi_spi
    spi_id: spi_bus
    model: GC9A01A
    data_rate: 80MHz
    cs_pin: GPIO5
    dc_pin: GPIO47
    reset_pin: GPIO38
    invert_colors: true
    dimensions: 240x240
    transform:
      mirror_x: true
      mirror_y: false
      swap_xy: false
    id: my_display
    auto_clear_enabled: false
    update_interval: never

touchscreen:
  - platform: cst816
    id: my_touch
    i2c_id: i2c_touch
    interrupt_pin: GPIO12
    reset_pin: GPIO6

# ==============================================================================
# FONTS & ICONS
# ==============================================================================
font:
  - file: "gfonts://Roboto"
    id: font_clock
    size: 70
    glyphs: "0123456789:"

  - file: "gfonts://Roboto"
    id: font_text
    size: 20
    glyphs: " !\"#%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyzÀÁÈÉÌÍÒÓÙÚàáèéìíòóùúÄÖÜäöü°–—_[]{}"

  - file: "gfonts://Roboto"
    id: font_debug
    size: 14
    glyphs: " !\"#%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyzÀÁÈÉÌÍÒÓÙÚàáèéìíòóùúÄÖÜäöü°–—_[]{}"

  - file: "gfonts://Material+Symbols+Outlined"
    id: font_icon
    size: 52
    glyphs:
      - "\U0000E002"  # warning
      - "\U0000E88E"  # info
      - "\U0000E813"  # sentiment_satisfied
      - "\U0000E88A"  # home
      - "\U0000F088"  # window
      - "\U0000E846"  # thermometer
      - "\U0000E90F"  # lightbulb
      - "\U0000E897"  # lock
      - "\U0000E898"  # lock_open
      - "\U0000E7F4"  # notifications
      - "\U0000E872"  # delete

  - file: "gfonts://Material+Symbols+Outlined"
    id: font_weather
    size: 26
    glyphs:
      - "\U0000E81A"  # sunny
      - "\U0000F159"  # bedtime / clear-night
      - "\U0000F172"  # partly_cloudy_day
      - "\U0000F15C"  # cloudy
      - "\U0000F176"  # rainy / pouring
      - "\U0000EBDB"  # thunderstorm
      - "\U0000EB3B"  # ac_unit (snow/hail)
      - "\U0000E818"  # foggy
      - "\U0000E846"  # thermostat
      - "\U0000E7F4"  # notifications bell (standby badge)

# ==============================================================================
# LVGL USER INTERFACE
# ==============================================================================
lvgl:
  displays:
    - my_display

  buffer_size: 12%
  log_level: WARN

  touchscreens:
    - touchscreen_id: my_touch
      long_press_time: 800ms
      long_press_repeat_time: 65535ms

  pages:
    # --------------------------------------------------------------------------
    # 1. HOME / STANDBY (Clock + Outdoor Weather + Notification Badge)
    # --------------------------------------------------------------------------
    - id: home_page
      bg_color: 0x000000
      bg_opa: COVER
      scrollable: false
      widgets:
        # Notification Badge (Small icon above the clock when unread notifications exist)
        - label:
            id: notif_badge_label
            text: ""
            align: CENTER
            y: -65
            text_font: font_weather
            text_color: 0xFFA500
            clickable: false
            bg_opa: TRANSP

        - label:
            id: clock_label
            text: "--:--"
            align: CENTER
            y: -20
            text_font: font_clock
            text_color: 0xFFFFFF
            clickable: false
            bg_opa: TRANSP

        - label:
            id: weather_icon_label
            text: "\uE846"
            align: CENTER
            x: -28
            y: 44
            text_font: font_weather
            text_color: 0x888888
            clickable: false
            bg_opa: TRANSP

        - label:
            id: weather_temp_label
            text: "--°C"
            align: CENTER
            x: 18
            y: 44
            text_font: font_text
            text_color: 0xFFFFFF
            clickable: false
            bg_opa: TRANSP

      # Refresh clock, weather and badge whenever navigating to home
      on_load:
        then:
          - script.execute: update_clock_ui
          - script.execute: update_weather_ui
          - script.execute: update_badge_ui

      on_swipe_down:
        then:
          - if:
              condition:
                lambda: 'return !id(notif_texts).empty();'
              then:
                - lambda: 'id(current_notif_idx) = 0;'
                - script.execute: show_notification_transition
                - script.execute: reset_sleep_timer

      on_double_click:
        then:
          - script.execute: toggle_display

      on_long_press:
        then:
          - light.turn_on:
              id: display_backlight
              transition_length: 0ms
          - script.stop: reset_sleep_timer
          - script.execute: update_debug_page
          - lvgl.page.show:
              id: debug_page
              animation: MOVE_TOP
              time: 180ms
          - script.execute: reset_sleep_timer

    # --------------------------------------------------------------------------
    # 2. NOTIFICATIONS
    # --------------------------------------------------------------------------
    - id: notifications_page
      bg_color: 0x000000
      bg_opa: COVER
      scrollable: false
      widgets:
        - label:
            id: notif_icon_label
            text: ""
            align: TOP_MID
            y: 10
            width: 80
            height: 58
            text_align: CENTER
            text_font: font_icon
            text_color: 0xFFFFFF
            clickable: false
            bg_opa: TRANSP

        - label:
            id: notif_text_label
            text: "No notifications"
            align: CENTER
            y: 18
            width: 210
            height: 128
            long_mode: WRAP
            text_align: CENTER
            text_font: font_text
            text_line_space: 4
            text_color: 0xFFFFFF
            clickable: false
            bg_opa: TRANSP

        - label:
            id: notif_counter_label
            text: "0/0"
            align: BOTTOM_MID
            y: -18
            text_font: font_debug
            text_color: 0x888888
            clickable: false
            bg_opa: TRANSP

      on_swipe_left:
        then:
          - if:
              condition:
                lambda: 'return !id(notif_texts).empty() && id(current_notif_idx) < ((int) id(notif_texts).size() - 1);'
              then:
                - lambda: 'id(current_notif_idx)++;'
                - script.execute: show_notification_transition
                - script.execute: reset_sleep_timer

      on_swipe_right:
        then:
          - if:
              condition:
                lambda: 'return !id(notif_texts).empty() && id(current_notif_idx) > 0;'
              then:
                - lambda: 'id(current_notif_idx)--;'
                - script.execute: show_notification_transition
                - script.execute: reset_sleep_timer

      on_swipe_up:
        then:
          - lvgl.page.show:
              id: home_page
              animation: MOVE_TOP
              time: 180ms
          - script.execute: reset_sleep_timer

      on_swipe_down:
        then:
          - script.stop: notification_timeout
          - lvgl.page.show:
              id: delete_page
              animation: MOVE_BOTTOM
              time: 180ms
          - script.execute: reset_sleep_timer

      on_double_click:
        then:
          - script.execute: toggle_display

    # --------------------------------------------------------------------------
    # 3. DIAGNOSTICS & DEBUG
    # --------------------------------------------------------------------------
    - id: debug_page
      bg_color: 0x000000
      bg_opa: COVER
      scrollable: false
      widgets:
        # Header Title
        - label:
            id: debug_title_label
            text: "SYSTEM INFO"
            align: TOP_MID
            y: 20
            text_font: font_text
            text_color: 0x00E5FF
            text_align: CENTER
            clickable: false
            bg_opa: TRANSP

        # Centered System Metrics
        - label:
            id: debug_info_label
            text: "Loading diagnostics..."
            align: CENTER
            y: 4
            width: 200
            text_font: font_debug
            text_color: 0xFFFFFF
            text_line_space: 6
            text_align: CENTER
            clickable: false
            bg_opa: TRANSP

        # Bottom Exit Prompt
        - label:
            id: debug_hint_label
            text: "Swipe to exit"
            align: BOTTOM_MID
            y: -18
            text_font: font_debug
            text_color: 0x666666
            text_align: CENTER
            clickable: false
            bg_opa: TRANSP

      on_load:
        then:
          - script.execute: update_debug_page

      on_swipe_up:
        then:
          - lvgl.page.show:
              id: home_page
              animation: MOVE_BOTTOM
              time: 180ms
          - script.execute: reset_sleep_timer

      on_swipe_down:
        then:
          - lvgl.page.show:
              id: home_page
              animation: MOVE_TOP
              time: 180ms
          - script.execute: reset_sleep_timer

      on_double_click:
        then:
          - script.execute: toggle_display

    # --------------------------------------------------------------------------
    # 4. DELETE CONFIRMATION MODAL
    # --------------------------------------------------------------------------
    - id: delete_page
      bg_color: 0x000000
      bg_opa: COVER
      scrollable: false
      widgets:
        - label:
            text: "Vuoi cancellare\nle notifiche?"
            align: TOP_MID
            y: 55
            text_align: CENTER
            text_font: font_text
            text_color: 0xFFFFFF
            clickable: false
            bg_opa: TRANSP

        # NO Button (Green: safe)
        - button:
            x: 38
            y: 130
            width: 68
            height: 50
            bg_color: 0x009900
            widgets:
              - label:
                  text: "NO"
                  align: CENTER
                  text_font: font_text
                  text_color: 0xFFFFFF
            on_click:
              - lvgl.page.show:
                  id: notifications_page
                  animation: MOVE_TOP
                  time: 120ms
              - script.execute: reset_sleep_timer

        # SI Button (Red: destructive)
        - button:
            x: 134
            y: 130
            width: 68
            height: 50
            bg_color: 0xCC0000
            widgets:
              - label:
                  text: "SI"
                  align: CENTER
                  text_font: font_text
                  text_color: 0xFFFFFF
            on_click:
              - lambda: |-
                  id(notif_texts).clear();
                  id(notif_icons).clear();
                  id(notif_colors).clear();
                  id(current_notif_idx) = 0;
              - script.stop: notification_timeout
              - script.execute: update_badge_ui
              - lvgl.page.show:
                  id: home_page
                  animation: FADE_IN
                  time: 120ms
              - script.execute: reset_sleep_timer

      on_double_click:
        then:
          - script.execute: toggle_display

    # --------------------------------------------------------------------------
    # 5. WHITE FLASH TRANSITION
    # --------------------------------------------------------------------------
    - id: transition_page
      bg_color: 0xFFFFFF
      bg_opa: COVER
      scrollable: false
      widgets: []
