# ==============================================================================
# LVGL GRAPHICAL USER INTERFACE & PAGES
# ==============================================================================
# - Pages:
#     1. home_page: Standby clock, weather widget, gestures
#     2. notifications_page: Interactive notification cards (LIFO queue)
#     3. debug_page: System hardware, network, battery & uptime status
#     4. delete_page: Clear notifications confirmation modal
#     5. transition_page: White flash visual effect
# ==============================================================================

lvgl:
  displays:
    - my_display

  # 12% buffer size keeps the draw buffer inside fast internal SRAM,
  # avoiding PSRAM bus contention and screen tearing on SPI round displays.
  buffer_size: 12%
  log_level: WARN

  touchscreens:
    - touchscreen_id: my_touch
      long_press_time: 800ms
      long_press_repeat_time: 65535ms

  pages:
    # --------------------------------------------------------------------------
    # 1. HOME / STANDBY PAGE (Clock + Outdoor Weather + Notification Badge)
    # --------------------------------------------------------------------------
    - id: home_page
      bg_color: 0x000000
      bg_opa: COVER
      scrollable: false
      widgets:
        # Notification Badge (Small icon above the clock when unread notifications exist)
        - label:
            id: notif_badge_label
            text: ""
            align: CENTER
            y: -65
            text_font: font_weather
            text_color: 0xFFA500
            clickable: false
            bg_opa: TRANSP

        # Digital Clock (HH:MM)
        - label:
            id: clock_label
            text: "--:--"
            align: CENTER
            y: -20
            text_font: font_clock
            text_color: 0xFFFFFF
            clickable: false
            bg_opa: TRANSP

        # Weather Condition Icon
        - label:
            id: weather_icon_label
            text: "\uE846"
            align: CENTER
            x: -28
            y: 44
            text_font: font_weather
            text_color: 0x888888
            clickable: false
            bg_opa: TRANSP

        # Outdoor Temperature
        - label:
            id: weather_temp_label
            text: "--°C"
            align: CENTER
            x: 18
            y: 44
            text_font: font_text
            text_color: 0xFFFFFF
            clickable: false
            bg_opa: TRANSP

      # Refresh clock, weather and badge whenever navigating to home
      on_load:
        then:
          - script.execute: update_clock_ui
          - script.execute: update_weather_ui
          - script.execute: update_badge_ui

      # Swipe down from clock: Open notification history
      on_swipe_down:
        then:
          - if:
              condition:
                lambda: 'return !id(notif_texts).empty();'
              then:
                - lambda: 'id(current_notif_idx) = 0;'
                - script.execute: show_notification_transition
                - script.execute: reset_sleep_timer

      # Double click on clock: Turn display on/off
      on_double_click:
        then:
          - script.execute: toggle_display

      # Long press on clock: Open system diagnostics page
      on_long_press:
        then:
          - light.turn_on:
              id: display_backlight
              transition_length: 0ms
          - script.stop: reset_sleep_timer
          - script.execute: update_debug_page
          - lvgl.page.show:
              id: debug_page
              animation: MOVE_TOP
              time: 180ms
          - script.execute: reset_sleep_timer

    # --------------------------------------------------------------------------
    # 2. NOTIFICATIONS PAGE (Icon, Message, and Position Counter)
    # --------------------------------------------------------------------------
    - id: notifications_page
      bg_color: 0x000000
      bg_opa: COVER
      scrollable: false
      widgets:
        - label:
            id: notif_icon_label
            text: ""
            align: TOP_MID
            y: 10
            width: 80
            height: 58
            text_align: CENTER
            text_font: font_icon
            text_color: 0xFFFFFF
            clickable: false
            bg_opa: TRANSP

        - label:
            id: notif_text_label
            text: "No notifications"
            align: CENTER
            y: 18
            width: 210
            height: 128
            long_mode: WRAP
            text_align: CENTER
            text_font: font_text
            text_line_space: 4
            text_color: 0xFFFFFF
            clickable: false
            bg_opa: TRANSP

        - label:
            id: notif_counter_label
            text: "0/0"
            align: BOTTOM_MID
            y: -18
            text_font: font_debug
            text_color: 0x888888
            clickable: false
            bg_opa: TRANSP

      # Swipe Left: Older notification
      on_swipe_left:
        then:
          - if:
              condition:
                lambda: 'return !id(notif_texts).empty() && id(current_notif_idx) < ((int) id(notif_texts).size() - 1);'
              then:
                - lambda: 'id(current_notif_idx)++;'
                - script.execute: show_notification_transition
                - script.execute: reset_sleep_timer

      # Swipe Right: Newer notification
      on_swipe_right:
        then:
          - if:
              condition:
                lambda: 'return !id(notif_texts).empty() && id(current_notif_idx) > 0;'
              then:
                - lambda: 'id(current_notif_idx)--;'
                - script.execute: show_notification_transition
                - script.execute: reset_sleep_timer

      # Swipe Up: Return to clock home page
      on_swipe_up:
        then:
          - lvgl.page.show:
              id: home_page
              animation: MOVE_TOP
              time: 180ms
          - script.execute: reset_sleep_timer

      # Swipe Down: Open confirmation dialog to delete all notifications
      on_swipe_down:
        then:
          - script.stop: notification_timeout
          - lvgl.page.show:
              id: delete_page
              animation: MOVE_BOTTOM
              time: 180ms
          - script.execute: reset_sleep_timer

      # Double click: Toggle screen backlight On / Off
      on_double_click:
        then:
          - script.execute: toggle_display

    # --------------------------------------------------------------------------
    # 3. DIAGNOSTICS & DEBUG PAGE
    # --------------------------------------------------------------------------
    - id: debug_page
      bg_color: 0x000000
      bg_opa: COVER
      scrollable: false
      widgets:
        # Header Title
        - label:
            id: debug_title_label
            text: "SYSTEM INFO"
            align: TOP_MID
            y: 20
            text_font: font_text
            text_color: 0x00E5FF
            text_align: CENTER
            clickable: false
            bg_opa: TRANSP

        # Centered System Metrics
        - label:
            id: debug_info_label
            text: "Loading diagnostics..."
            align: CENTER
            y: 4
            width: 200
            text_font: font_debug
            text_color: 0xFFFFFF
            text_line_space: 6
            text_align: CENTER
            clickable: false
            bg_opa: TRANSP

        # Bottom Exit Prompt
        - label:
            id: debug_hint_label
            text: "Swipe to exit"
            align: BOTTOM_MID
            y: -18
            text_font: font_debug
            text_color: 0x666666
            text_align: CENTER
            clickable: false
            bg_opa: TRANSP

      on_load:
        then:
          - script.execute: update_debug_page

      on_swipe_up:
        then:
          - lvgl.page.show:
              id: home_page
              animation: MOVE_BOTTOM
              time: 180ms
          - script.execute: reset_sleep_timer

      on_swipe_down:
        then:
          - lvgl.page.show:
              id: home_page
              animation: MOVE_TOP
              time: 180ms
          - script.execute: reset_sleep_timer

      on_double_click:
        then:
          - script.execute: toggle_display

    # --------------------------------------------------------------------------
    # 4. DELETE CONFIRMATION MODAL
    # --------------------------------------------------------------------------
    - id: delete_page
      bg_color: 0x000000
      bg_opa: COVER
      scrollable: false
      widgets:
        - label:
            text: "Vuoi cancellare\nle notifiche?"
            align: TOP_MID
            y: 55
            text_align: CENTER
            text_font: font_text
            text_color: 0xFFFFFF
            clickable: false
            bg_opa: TRANSP

        # NO Button (Green: safe action to dismiss modal and retain notifications)
        - button:
            x: 38
            y: 130
            width: 68
            height: 50
            bg_color: 0x009900
            widgets:
              - label:
                  text: "NO"
                  align: CENTER
                  text_font: font_text
                  text_color: 0xFFFFFF
            on_click:
              - lvgl.page.show:
                  id: notifications_page
                  animation: MOVE_TOP
                  time: 120ms
              - script.execute: reset_sleep_timer

        # SI Button (Red: destructive action to clear all notifications)
        - button:
            x: 134
            y: 130
            width: 68
            height: 50
            bg_color: 0xCC0000
            widgets:
              - label:
                  text: "SI"
                  align: CENTER
                  text_font: font_text
                  text_color: 0xFFFFFF
            on_click:
              - lambda: |-
                  id(notif_texts).clear();
                  id(notif_icons).clear();
                  id(notif_colors).clear();
                  id(current_notif_idx) = 0;
              - script.stop: notification_timeout
              - script.execute: update_badge_ui
              - lvgl.page.show:
                  id: home_page
                  animation: FADE_IN
                  time: 120ms
              - script.execute: reset_sleep_timer

      # Double click: Toggle screen backlight On / Off
      on_double_click:
        then:
          - script.execute: toggle_display

    # --------------------------------------------------------------------------
    # 5. WHITE FLASH TRANSITION PAGE
    # --------------------------------------------------------------------------
    - id: transition_page
      bg_color: 0xFFFFFF
      bg_opa: COVER
      scrollable: false
      widgets: []

script:
  # Optimization A: Updates the digital clock on home page (event-driven)
  - id: update_clock_ui
    mode: restart
    then:
      - lvgl.label.update:
          id: clock_label
          text: !lambda |-
            auto now = id(sntp_time).now();
            if (!now.is_valid()) return std::string("--:--");
            return now.strftime("%H:%M");

  # Optimization C: Updates unread notification badge indicator above clock
  - id: update_badge_ui
    mode: restart
    then:
      - lvgl.label.update:
          id: notif_badge_label
          text: !lambda |-
            if (id(notif_texts).empty()) return std::string("");
            return std::string("\uE7F4"); // Small notification bell icon

  # Formats device diagnostics into a clean, centered layout
  - id: update_debug_page
    mode: restart
    then:
      - lvgl.label.update:
          id: debug_info_label
          text: !lambda |-
            std::string ip = id(ip_address).state.empty() ? "Connecting..." : id(ip_address).state;
            std::string ssid = id(wifi_ssid).state.empty() ? "-" : id(wifi_ssid).state;
            const char *charging_str = id(charging_sensor).state ? "Charging" : "Battery";

            char uptime_buf[32];
            uint32_t total = (uint32_t) id(uptime_sensor).state;
            uint32_t days = total / 86400UL;
            total %= 86400UL;
            uint32_t hours = total / 3600UL;
            total %= 3600UL;
            uint32_t mins = total / 60UL;
            snprintf(
              uptime_buf,
              sizeof(uptime_buf),
              "%ud %02uh %02um",
              (unsigned int) days, (unsigned int) hours, (unsigned int) mins
            );

            char buf[512];
            snprintf(
              buf,
              sizeof(buf),
              "IP: %s\n"
              "Wi-Fi: %s (%.0f dBm)\n"
              "Power: %.0f%% (%s)\n"
              "Uptime: %s\n"
              "ESPHome %s",
              ip.c_str(),
              ssid.c_str(),
              id(wifi_signal_db).state,
              id(battery_percentage).state,
              charging_str,
              uptime_buf,
              ESPHOME_VERSION
            );
            return std::string(buf);
