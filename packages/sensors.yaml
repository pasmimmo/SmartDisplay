# ============================================================
# SENSORI, BATTERIA E DIAGNOSTICA
# ============================================================

sensor:
  - platform: adc
    pin: GPIO1
    id: battery_percentage
    name: "${friendly_name} Batteria"
    attenuation: 12db
    update_interval: 60s
    filters:
      - multiply: 2.0
      - calibrate_linear:
          - 3.3 -> 0
          - 4.2 -> 100
      - clamp:
          min_value: 0
          max_value: 100

  - platform: wifi_signal
    id: wifi_signal_db
    name: "${friendly_name} WiFi Signal"
    update_interval: 30s
    entity_category: diagnostic

  - platform: uptime
    id: uptime_sensor
    name: "${friendly_name} Uptime"
    update_interval: 60s
    entity_category: diagnostic

binary_sensor:
  - platform: gpio
    pin: GPIO41
    id: charging_sensor
    name: "${friendly_name} In Ricarica"
    device_class: battery_charging
    on_press:
      - script.stop: reset_sleep_timer
      - light.turn_on:
          id: display_backlight
          transition_length: 0ms
    on_release:
      - script.execute: reset_sleep_timer

text_sensor:
  - platform: wifi_info
    ip_address:
      id: ip_address
      name: "${friendly_name} IP Address"
      entity_category: diagnostic
    ssid:
      id: wifi_ssid
      name: "${friendly_name} WiFi SSID"
      entity_category: diagnostic
    mac_address:
      id: wifi_mac
      name: "${friendly_name} WiFi MAC Address"
      entity_category: diagnostic

  - platform: version
    name: "${friendly_name} ESPHome Version"
    id: esphome_version_text
    hide_timestamp: true
    entity_category: diagnostic

