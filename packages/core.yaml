# ==============================================================================
# CORE & BASE SYSTEM
# ==============================================================================
# Defines the MCU architecture, PSRAM, networking, OTA, and time services.
# ==============================================================================

substitutions:
  device_name: "minidisplay"
  friendly_name: "MiniDisplay"
  timezone: "Europe/Rome"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2024.6.0
  name_add_mac_suffix: false
  on_boot:
    priority: -100
    then:
      - lvgl.page.show: home_page
      - light.turn_on:
          id: display_backlight
          transition_length: 0ms
      - script.execute: reset_sleep_timer

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

# 8MB Octal SPI PSRAM running at 80MHz (required for audio buffering and LVGL)
psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Synchronize time via SNTP for the clock display
time:
  - platform: sntp
    id: sntp_time
    timezone: ${timezone}

# Passive Bluetooth proxy mode:
# Active scanning is disabled to preserve RAM and avoid 2.4GHz Wi-Fi / BT coexistence
# audio stuttering during TTS playback.
esp32_ble_tracker:
  scan_parameters:
    active: false

bluetooth_proxy:
  active: false
