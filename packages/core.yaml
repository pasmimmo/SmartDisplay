# ============================================================
# CORE & SISTEMA BASE
# ============================================================

substitutions:
  device_name: "minidisplay"
  friendly_name: "MiniDisplay"
  timezone: "Europe/Rome"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2024.6.0
  name_add_mac_suffix: false
  on_boot:
    priority: -100
    then:
      - lvgl.page.show: home_page
      - light.turn_on:
          id: display_backlight
          transition_length: 0ms
      - script.execute: reset_sleep_timer

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

time:
  - platform: sntp
    id: sntp_time
    timezone: ${timezone}

esp32_ble_tracker:
  scan_parameters:
    active: false

bluetooth_proxy:
  active: false
