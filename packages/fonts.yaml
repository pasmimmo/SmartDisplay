# ==============================================================================
# FONTS & ICONS CONFIGURATION
# ==============================================================================
# - Typography: Google Fonts Roboto (Clock, Standard Text, Diagnostic labels)
# - Iconography: Google Material Symbols Outlined (Notifications, Weather)
# ==============================================================================

font:
  # Large digits for the standby clock display
  - file: "gfonts://Roboto"
    id: font_clock
    size: 70
    glyphs: "0123456789:"

  # General body text for notification messages and buttons
  - file: "gfonts://Roboto"
    id: font_text
    size: 20
    glyphs: " !\"#%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyzÀÁÈÉÌÍÒÓÙÚàáèéìíòóùúÄÖÜäöü°–—_[]{}"

  # Smaller text for the debug page and notification counter
  - file: "gfonts://Roboto"
    id: font_debug
    size: 14
    glyphs: " !\"#%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyzÀÁÈÉÌÍÒÓÙÚàáèéìíòóùúÄÖÜäöü°–—_[]{}"

  # High-resolution icons for full-screen notifications (52px)
  - file: "gfonts://Material+Symbols+Outlined"
    id: font_icon
    size: 52
    glyphs:
      - "\U0000E002"  # warning
      - "\U0000E88E"  # info
      - "\U0000E813"  # sentiment_satisfied
      - "\U0000E88A"  # home
      - "\U0000F088"  # window
      - "\U0000E846"  # thermometer
      - "\U0000E90F"  # lightbulb
      - "\U0000E897"  # lock
      - "\U0000E898"  # lock_open
      - "\U0000E7F4"  # notifications
      - "\U0000E872"  # delete

  # Compact icons for the standby weather widget (26px)
  - file: "gfonts://Material+Symbols+Outlined"
    id: font_weather
    size: 26
    glyphs:
      - "\U0000E81A"  # sunny
      - "\U0000F159"  # bedtime (clear night)
      - "\U0000F172"  # partly_cloudy_day
      - "\U0000F15C"  # cloudy
      - "\U0000F176"  # rainy / pouring
      - "\U0000EBDB"  # thunderstorm
      - "\U0000EB3B"  # ac_unit (snow / hail)
      - "\U0000E818"  # foggy
      - "\U0000E846"  # thermometer (fallback)
