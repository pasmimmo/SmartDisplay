# ==============================================================================
# AUDIO PIPELINE & MEDIA PLAYER
# ==============================================================================
# - Audio DAC: Everest ES8311 over dedicated I2C bus (address 0x18)
# - I2S Digital Audio: MCLK GPIO16, BCLK GPIO9, LRCLK GPIO45, DOUT GPIO8
# - Power Amp: Onboard amplifier enable switch on GPIO46 (dynamically managed)
# - Media Player: Integrated with Home Assistant announcement pipeline (TTS/WAV)
# ==============================================================================

substitutions:
  friendly_name: "SmartDisplay"

# Dedicated I2C bus for the ES8311 audio codec
i2c:
  - id: i2c_audio
    sda: GPIO15
    scl: GPIO14
    scan: true
    frequency: 400kHz

audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: i2c_audio
    address: 0x18
    sample_rate: 24000
    bits_per_sample: 16bit
    use_mclk: true

i2s_audio:
  - id: i2s_out
    i2s_mclk_pin: GPIO16
    i2s_bclk_pin:
      number: GPIO9
    i2s_lrclk_pin:
      number: GPIO45
      ignore_strapping_warning: true

# Amplifier enable pin:
# Kept internal and managed dynamically by the media player to save battery and
# eliminate idle background hiss during standby.
switch:
  - platform: gpio
    id: audio_amp
    name: "${friendly_name} Audio Amplifier"
    internal: true
    pin:
      number: GPIO46
      ignore_strapping_warning: true
    restore_mode: ALWAYS_OFF

speaker:
  - platform: i2s_audio
    id: speaker_hardware
    i2s_audio_id: i2s_out
    i2s_dout_pin: GPIO8
    dac_type: external
    audio_dac: es8311_dac
    sample_rate: 24000
    bits_per_sample: 16bit
    channel: mono
    buffer_duration: 50ms
    timeout: 500ms

# Home Assistant Media Player entity for text-to-speech (TTS) announcements
media_player:
  - platform: speaker
    id: speaker_media_player
    name: "${friendly_name} Speaker"
    volume_initial: 80%
    volume_min: 0%
    volume_max: 100%
    volume_increment: 5%
    buffer_size: 65536
    task_stack_in_psram: true
    announcement_pipeline:
      speaker: speaker_hardware
      format: WAV
      sample_rate: 24000
      num_channels: 1

    # Optimization D: Powers on amplifier only when audio is active, shuts off when idle
    on_announcement:
      - switch.turn_on: audio_amp
    on_play:
      - switch.turn_on: audio_amp
    on_idle:
      - delay: 1000ms
      - switch.turn_off: audio_amp
